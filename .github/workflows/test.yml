on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
name: Test
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PNPM
        uses: pnpm/action-setup@v6
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version-file: ".node-version"
      - name: Dependencies
        run: pnpm install
      - name: Commitlint
        run: pnpm --silent commitlint --from "$FROM" --to "$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          TO: ${{ github.event.pull_request.head.sha || 'HEAD' }}
      - name: Prettier
        run: pnpm --silent pretty
      - name: ESLint
        run: pnpm --silent lint
      - name: Test
        run: pnpm test
      - name: Coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
